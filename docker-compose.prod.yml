version: "3.8"

services:
  # ── MongoDB ──────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: pgsaathi-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # No ports exposed externally — only accessible within Docker network

  # ── Backend (FastAPI) ────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pgsaathi-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    environment:
      - MONGO_URL=mongodb://mongo:27017
    depends_on:
      - mongo

  # ── Frontend (React static build served by nginx) ───────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        REACT_APP_BACKEND_URL: https://${DOMAIN:-pgsaathi.online}
    container_name: pgsaathi-frontend
    restart: unless-stopped
    depends_on:
      - backend

  # ── Nginx (reverse proxy + SSL) ─────────────────────────
  nginx:
    image: nginx:alpine
    container_name: pgsaathi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend

  # ── Certbot (SSL certificate manager) ───────────────────
  certbot:
    image: certbot/certbot
    container_name: pgsaathi-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Renew certificates every 12 hours
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  mongo_data:
  certbot_www:
  certbot_certs:
